<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Flip Weather"><meta name="theme-color" content="#000000"><title>Flip Weather · Frankfurt</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}body{min-height:100vh}.screen{height:100%;height:100vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;align-items:center;justify-content:space-between;padding:3vh 3vw 2.5vh}.eyebrow{font-size:12px;letter-spacing:4px;color:#858585;font-weight:600}.clock-section{width:100%;-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;align-items:center;justify-content:center;min-height:0}.clock{display:-webkit-flex;display:flex;align-items:center;justify-content:center;gap:1.3vw;width:100%}.digit{position:relative;width:17vw;max-width:240px;height:34vh;max-height:300px;min-height:110px;border-radius:13px;background:#1b1b1d;overflow:hidden;box-shadow:inset 0 1px 0 #404044,0 8px 18px rgba(0,0,0,.7);border:1px solid #303034}.digit .upper,.digit .lower{position:absolute;left:0;width:100%;height:50%;overflow:hidden;background:#242427}.digit .upper{top:0;border-radius:12px 12px 0 0;background:linear-gradient(#29292c,#222225)}.digit .lower{bottom:0;border-radius:0 0 12px 12px;background:linear-gradient(#19191b,#242427)}.digit .upper span,.digit .lower span{position:absolute;left:0;width:100%;height:200%;line-height:34vh;text-align:center;font-size:29vh;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.06em;color:#E8BD66;text-shadow:0 1px 0 #6B451A,0 2px 8px rgba(229,170,64,.18);white-space:nowrap}.digit .upper span{top:0}.digit .lower span{bottom:0}.digit:after{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:#070708;box-shadow:0 1px 0 #454549;z-index:6}.digit:before{content:"";position:absolute;left:0;right:0;top:0;height:100%;border-radius:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);z-index:7;pointer-events:none}.digit.flip .upper{animation:flipTop .32s ease-in both;transform-origin:bottom center}.digit.flip .lower{animation:flipBottom .32s .28s ease-out both;transform-origin:top center}@keyframes flipTop{0%{transform:perspective(500px) rotateX(0deg);filter:brightness(1)}100%{transform:perspective(500px) rotateX(-85deg);filter:brightness(.55)}}@keyframes flipBottom{0%{transform:perspective(500px) rotateX(85deg);filter:brightness(.5)}100%{transform:perspective(500px) rotateX(0deg);filter:brightness(1)}}.colon{font-size:17vh;line-height:1;color:#D8A94E;margin:0 .3vw;position:relative;top:-1.3vh}.date{margin-top:3vh;color:#bcbcbc;font-size:clamp(17px,2.5vw,28px);font-weight:400;letter-spacing:.3px;text-align:center}.weather-area{width:100%;max-width:1120px;border-top:1px solid #252525;padding-top:2.1vh;flex-shrink:0}.current{display:-webkit-flex;display:flex;align-items:center;justify-content:center;gap:16px;min-height:56px;margin-bottom:1.4vh}.current-icon{font-size:35px}.temp{font-size:38px;font-weight:500;letter-spacing:-2px}.condition{font-size:16px;color:#bbb}.detail{font-size:13px;color:#828282;margin-top:4px}.forecast-title{text-align:center;color:#8e8e8e;font-size:11px;font-weight:600;letter-spacing:2.4px;margin:1vh 0 1.3vh}.hours{display:-webkit-flex;display:flex;justify-content:space-between;gap:5px}.hour{min-width:0;flex:1;text-align:center;border-radius:10px;padding:8px 2px}.hour.rainy{background:#101b28}.hour-time{font-size:13px;color:#aaa}.hour-icon{font-size:22px;margin:6px 0}.hour-temp{font-size:17px;color:#f2f2f2}.hour-rain{font-size:12px;color:#77bfff;margin-top:5px;font-weight:600}.hour-rain.dry{color:#555}.alert{min-height:31px;text-align:center;margin-top:1.2vh;font-size:14px;color:#9b9b9b}.alert.wet{color:#9ecbff}.alert strong{color:#cde6ff}.foot{text-align:center;font-size:10px;color:#444;margin-top:3px}#error{display:none;color:#888;font-size:12px;text-align:center}
@media (orientation:portrait){.screen{padding:4vh 3vw 3vh}.digit{width:18.5vw;height:21vh;min-height:90px}.digit .upper span,.digit .lower span{line-height:21vh;font-size:18vh}.colon{font-size:11vh}.date{margin-top:2vh}.weather-area{padding-top:2vh}.current{margin-bottom:2vh}.hour-icon{font-size:19px}.hour-temp{font-size:15px}.hour-rain{font-size:11px}}

/* iPad Air 1 landscape: reserve real space for date and all six forecast columns */
.screen{padding:10px 24px 12px;justify-content:initial;-webkit-justify-content:initial}
.eyebrow{flex:none;-webkit-flex:none;margin:2px 0 0}
.clock-section{flex:1 1 auto;-webkit-flex:1 1 auto;min-height:0;justify-content:center;-webkit-justify-content:center}
.clock{gap:0}
.digit{width:16.4vw;height:31vh;min-height:0;max-height:none;margin:0 .45vw}
.digit .upper span,.digit .lower span{line-height:31vh;font-size:26vh}
.colon{font-size:15vh;margin:0 .7vw}
.date{margin-top:13px;font-size:24px;line-height:1.2;color:#f1f1f1;text-transform:capitalize}
.weather-area{flex:none;-webkit-flex:none;padding-top:9px;max-width:1100px}
.current{min-height:39px;margin-bottom:3px;gap:0}

@media (orientation:portrait){
.screen{padding:24px 12px 18px}.digit{width:18.5vw;height:20vh;min-height:0;margin:0 .2vw}
.digit .upper span,.digit .lower span{line-height:20vh;font-size:17vh}

}

.screen{padding:7px 20px 6px}.eyebrow{font-size:10px}

</style></head><body><main class="screen"><div class="eyebrow">FRANKFURT AM MAIN</div><section class="clock-section"><div class="clock" aria-label="Время"><div class="digit" id="d0"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div></div><div class="digit" id="d1"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div></div><div class="colon">:</div><div class="digit" id="d2"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div></div><div class="digit" id="d3"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div></div></div><div class="date" id="date">Загрузка даты…</div></section><section class="weather-area"><div class="current"><span class="current-icon" id="nowIcon">☁</span><span class="temp" id="nowTemp">—°</span><div><div class="condition" id="nowDesc">Загрузка погоды…</div><div class="detail" id="nowDetails">Франкфурт-на-Майне</div></div></div><div class="forecast-title">ПРОГНОЗ НА БЛИЖАЙШИЕ 6 ЧАСОВ · ☂ ВЕРОЯТНОСТЬ ДОЖДЯ</div><div class="hours" id="hours"></div><div class="alert" id="alert">Проверяем вероятность дождя…</div><div id="error"></div><div class="foot" id="updated">Прогноз Open-Meteo · обновление каждые 15 минут</div></section></main>
<script>
(function(){'use strict';
var dayNames=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];var monthNames=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];var previous=['','','',''];var timeZone='Europe/Berlin';
function berlinParts(date){try{var parts=new Intl.DateTimeFormat('en-GB',{timeZone:timeZone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'}).formatToParts(date);var obj={};for(var i=0;i<parts.length;i++)obj[parts[i].type]=parts[i].value;return {year:+obj.year,month:+obj.month,day:+obj.day,hour:+obj.hour,minute:+obj.minute,weekday:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(obj.weekday)};}catch(e){return {year:date.getFullYear(),month:date.getMonth()+1,day:date.getDate(),hour:date.getHours(),minute:date.getMinutes(),weekday:date.getDay()};}}
function two(n){return ('0'+n).slice(-2)}
function clockTick(){var p=berlinParts(new Date());var s=two(p.hour)+two(p.minute);for(var i=0;i<4;i++){if(previous[i]!==s.charAt(i)){(function(index,digit){var el=document.getElementById('d'+index);el.className='digit';el.querySelector('.upper span').textContent=digit;el.querySelector('.lower span').textContent=digit;if(previous[index]!==''){void el.offsetWidth;el.className='digit flip';setTimeout(function(){el.className='digit'},650)}previous[index]=digit})(i,s.charAt(i));}}document.getElementById('date').textContent=dayNames[p.weekday]+', '+p.day+' '+monthNames[p.month-1]+' '+p.year;}
function icon(code,day){if(code===0)return day?'☀':'☾';if(code<=3)return day?'⛅':'☁';if(code===45||code===48)return '≋';if(code>=51&&code<=67)return '🌧';if(code>=71&&code<=77)return '❄';if(code>=80&&code<=82)return '🌧';if(code>=95)return '⛈';return '☁'}
function desc(code){if(code===0)return 'Ясно';if(code<=2)return 'Переменная облачность';if(code===3)return 'Облачно';if(code===45||code===48)return 'Туман';if(code>=51&&code<=57)return 'Морось';if(code>=61&&code<=67)return 'Дождь';if(code>=71&&code<=77)return 'Снег';if(code>=80&&code<=82)return 'Ливень';if(code>=95)return 'Гроза';return 'Облачно'}
function safe(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function showWeather(data){if(!data||!data.current||!data.hourly)throw Error('Нет данных');var c=data.current;document.getElementById('nowIcon').textContent=icon(c.weather_code,c.is_day);document.getElementById('nowTemp').textContent=Math.round(c.temperature_2m)+'°';document.getElementById('nowDesc').textContent=desc(c.weather_code);document.getElementById('nowDetails').textContent='Ветер '+Math.round(c.wind_speed_10m)+' км/ч · влажность '+c.relative_humidity_2m+'%';var h=data.hourly,nowHour=c.time.slice(0,13),start=-1;for(var i=0;i<h.time.length;i++){if(h.time[i].slice(0,13)>=nowHour){start=i;break}}if(start<0)start=0;var html='',rainPeak=0,firstRain='',rainSum=0;for(var j=start;j<Math.min(start+6,h.time.length);j++){var hour=h.time[j].slice(11,13),p=h.precipitation_probability[j]||0,mm=h.precipitation[j]||0,code=h.weather_code[j];if(p>rainPeak)rainPeak=p;if((p>=45||mm>=0.2)&&!firstRain)firstRain=hour+':00';rainSum+=mm;html+='<div class="hour '+((p>=45||mm>=0.2)?'rainy':'')+'"><div class="hour-time">'+hour+':00</div><div class="hour-icon">'+safe(icon(code,true))+'</div><div class="hour-temp">'+Math.round(h.temperature_2m[j])+'°</div><div class="hour-rain '+(p<20?'dry':'')+'">☂ '+p+'%</div></div>';}document.getElementById('hours').innerHTML=html;var a=document.getElementById('alert');if(firstRain){a.className='alert wet';a.innerHTML='☂ Возможен дождь с <strong>'+firstRain+'</strong> · вероятность до <strong>'+rainPeak+'%</strong>';}else{a.className='alert';a.textContent='☀ В ближайшие 6 часов существенный дождь маловероятен';}document.getElementById('error').style.display='none';document.getElementById('updated').textContent='Open-Meteo · обновлено '+two(berlinParts(new Date()).hour)+':'+two(berlinParts(new Date()).minute);}
function loadWeather(){var url='https://api.open-meteo.com/v1/forecast?latitude=50.1109&longitude=8.6821&timezone=Europe%2FBerlin&forecast_days=2&current=temperature_2m,relative_humidity_2m,is_day,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,precipitation,weather_code';var xhr=new XMLHttpRequest();xhr.open('GET',url,true);xhr.timeout=14000;xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status>=200&&xhr.status<300){try{showWeather(JSON.parse(xhr.responseText));return}catch(e){}}document.getElementById('error').style.display='block';document.getElementById('error').textContent='Не удалось обновить погоду. Повторим через 15 минут.';document.getElementById('nowDesc').textContent='Нет соединения с погодным сервисом';document.getElementById('alert').textContent='Прогноз временно недоступен';};xhr.onerror=function(){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Проверьте Wi-Fi';};xhr.send();}
clockTick();setInterval(clockTick,1000);loadWeather();setInterval(loadWeather,15*60*1000);
})();
</script></body></html>
